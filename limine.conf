# HMOS Limine configuration
# FW_TYPE macro expands to UEFI or BIOS automatically.

timeout: 3
default_entry: 1
interface_branding: HMOS - Dual Boot ISO
interface_help_hidden: yes

# HMOS native Limine-protocol kernel (loads on both BIOS and UEFI; the
# kernel itself prints the BIOS/UEFI specific message).
/HMOS - Boot (${FW_TYPE})
    comment: HMOS Limine protocol kernel
    protocol: limine
    path: boot():/boot/hmoskernel

# Legacy UEFI chainloaded app (kept as a fallback EFI entry).
/HMOS - UEFI chainload (${FW_TYPE})
    comment: HMOS EFI application chainloaded by Limine
    protocol: efi
    path: boot():/EFI/BOOT/HMOS.EFI
